<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Cierre de Caja</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería SheetJS para exportar a Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- Navegación principal -->
        <header class="app-header">
            <h1>Control de Caja Diario</h1>
            <nav class="tabs-nav">
                <button class="tab-btn active" onclick="switchTab('tab-registro', this)">Registro Diario</button>
                <button class="tab-btn" onclick="switchTab('tab-reportes', this)">Reportes y Excel</button>
            </nav>
        </header>

        <!-- Pestaña 1: Registro de Cierre -->
        <section id="tab-registro" class="tab-content active">
            <form id="formCierre" class="cierre-form">
                <h2>Nuevo Cierre de Turno</h2>

                <div class="form-group">
                    <label for="fecha">Fecha del Cierre:</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="form-group">
                    <label for="sucursal">Sucursal:</label>
                    <select id="sucursal" required>
                        <option value="Santa Barbara">Santa Bárbara</option>
                        <option value="Ralco">Ralco</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="empleado">Empleado que entrega:</label>
                    <input type="text" id="empleado" placeholder="Nombre y Apellido" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="efectivo">Efectivo total en caja ($):</label>
                    <input type="number" id="efectivo" placeholder="Monto total contado" min="0" step="any" required>
                </div>

                <div class="form-group">
                    <label for="retiro">Monto a retirar ($):</label>
                    <input type="number" id="retiro" placeholder="0 si no hay retiro" min="0" step="any" value="0">
                </div>

                <div class="preview-card">
                    <span class="preview-label">Saldo final que queda en caja:</span>
                    <span id="previewSaldo" class="preview-amount">$0</span>
                </div>

                <button type="submit" class="btn-primary">Guardar Cierre Diario</button>
            </form>
        </section>

        <!-- Pestaña 2: Reportes y Exportación -->
        <section id="tab-reportes" class="tab-content">
            <!-- Bloque de Autenticación por PIN -->
            <div id="pinAuthContainer" class="pin-card">
                <h3>Acceso Restringido</h3>
                <p>Ingresa el PIN de seguridad para visualizar y exportar los reportes:</p>
                <div class="pin-inputs">
                    <input type="password" id="inputPin" maxlength="8" placeholder="****">
                    <button type="button" class="btn-secondary" onclick="verificarPin()">Ingresar</button>
                </div>
                <div id="pinMsg" class="pin-msg"></div>
            </div>

            <!-- Contenido protegido de Reportes -->
            <div id="contenidoReportes" style="display: none;">
                <div class="reportes-toolbar">
                    <div class="filtros-grid">
                        <div class="filtro-item">
                            <label for="filtro-desde">Desde:</label>
                            <input type="date" id="filtro-desde" onchange="filtrarYMostrarCierres()">
                        </div>
                        <div class="filtro-item">
                            <label for="filtro-hasta">Hasta:</label>
                            <input type="date" id="filtro-hasta" onchange="filtrarYMostrarCierres()">
                        </div>
                        <div class="filtro-item">
                            <label for="filtro-sucursal">Sucursal:</label>
                            <select id="filtro-sucursal" onchange="filtrarYMostrarCierres()">
                                <option value="Todas">Todas</option>
                                <option value="Santa Barbara">Santa Bárbara</option>
                                <option value="Ralco">Ralco</option>
                            </select>
                        </div>
                    </div>

                    <button type="button" class="btn-excel" onclick="exportarExcel()">
                        📊 Descargar Reporte Excel
                    </button>
                </div>

                <!-- Tabla de Historial -->
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Sucursal</th>
                                <th>Empleado</th>
                                <th>Efectivo en Caja</th>
                                <th>Retiro</th>
                                <th>Queda en Caja</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaCierres">
                            <!-- Filas inyectadas dinámicamente con JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
